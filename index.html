<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>별 잡기 게임 | 닥터과학로봇코딩학원</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#72c5fa 0%,#a9dfff 43%,#eefaff 100%);color:#fff;font-family:Arial,'Malgun Gothic',sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(92vw,480px);text-align:center}h1{font-size:30px;margin:12px}p{color:#ced9ff}.info{display:flex;justify-content:space-around;margin:15px 0;font-size:17px;gap:8px;flex-wrap:wrap}#field{height:430px;max-height:55vh;border:2px solid #7998ec;border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#1c3671,#0b142c);touch-action:manipulation}.star{position:absolute;border:0;background:none;font-size:46px;cursor:pointer;filter:drop-shadow(0 0 10px #ffdf6b);transform:translate(-50%,-50%);animation:pop .2s ease-out}@keyframes pop{from{scale:.3}to{scale:1}}button.start{padding:14px 30px;border:0;background:#ffdc61;color:#17203c;border-radius:12px;font-size:19px;font-weight:bold;margin:18px;cursor:pointer}#message{font-size:19px;font-weight:bold;min-height:25px}footer{margin-top:12px;font-size:13px;color:#9faccd}footer a{color:inherit;text-decoration:none}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 160px 38px at 12% 19%,#fff 15%,transparent 73%),radial-gradient(ellipse 125px 52px at 20% 17%,#fff 20%,transparent 76%),radial-gradient(ellipse 155px 40px at 78% 12%,#fff 17%,transparent 75%),radial-gradient(ellipse 130px 56px at 86% 10%,#fff 20%,transparent 76%),radial-gradient(ellipse 200px 44px at 38% 75%,rgba(255,255,255,.85) 15%,transparent 76%),radial-gradient(ellipse 160px 58px at 44% 73%,rgba(255,255,255,.85) 20%,transparent 77%);filter:blur(7px)}.wrap{position:relative;z-index:1;background:rgba(12,34,79,.35);padding:12px;border-radius:20px;box-shadow:0 12px 38px rgba(38,91,147,.18)}</style></head><body><main class="wrap"><h1>⭐ 별 잡기 게임</h1><p>30초 동안 나타나는 별을 최대한 많이 누르세요!</p><div class="info"><span>점수: <b id="score">0</b></span><span>최고 점수: <b id="best">0</b></span><span>남은 시간: <b id="time">30</b>초</span></div><div id="field" aria-label="별 잡기 놀이 영역"></div><button id="start" class="start">게임 시작</button><div id="message">시작 버튼을 눌러주세요.</div><footer>닥터과학로봇코딩학원 · <a href="tel:0422725222">042-272-5222</a></footer></main><script>const field=document.getElementById('field'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),msg=document.getElementById('message'),start=document.getElementById('start');const bestEl=document.getElementById('best'),BEST_KEY='star-game-best-score';let best=0;try{best=Number(localStorage.getItem(BEST_KEY))||0}catch(e){}bestEl.textContent=best;let score=0,time=30,timer=null,spawnTimer=null,playing=false;function saveBest(){if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem(BEST_KEY,String(best))}catch(e){}return true}return false}function spawn(){if(!playing)return;field.innerHTML='';const b=document.createElement('button');b.className='star';b.textContent='⭐';b.setAttribute('aria-label','별 잡기');b.style.left=(10+Math.random()*80)+'%';b.style.top=(12+Math.random()*76)+'%';b.onclick=()=>{if(!playing)return;score++;scoreEl.textContent=score;saveBest();spawn()};field.appendChild(b)}function finish(){playing=false;clearInterval(timer);clearInterval(spawnTimer);field.innerHTML='';msg.textContent=`게임 종료! ${score}점 획득 🎉 최고 기록: ${best}점`;start.textContent='다시 하기'}start.onclick=()=>{clearInterval(timer);clearInterval(spawnTimer);playing=true;score=0;time=30;scoreEl.textContent=score;timeEl.textContent=time;msg.textContent='별을 터치하세요!';start.textContent='진행 중';spawn();spawnTimer=setInterval(spawn,1100);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)};</script></body></html>
