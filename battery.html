<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StickS3 배터리 | 스타게임</title>
<style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#e8f5ff;color:#173c68;max-width:620px;margin:40px auto;padding:16px;text-align:center}.panel{background:#fff;border-radius:22px;padding:30px 18px;box-shadow:0 5px 28px #9bbbd833}h1{font-size:27px}#battery{font-size:64px;font-weight:bold;margin:16px}#status{font-size:17px}#updated{font-size:14px;color:#567}a{color:#164b9d}button{border:0;border-radius:12px;padding:12px 20px;background:#1760ac;color:white;font-weight:bold;font-size:16px;cursor:pointer}.bar{height:22px;background:#d6e3ef;border-radius:12px;overflow:hidden;margin:20px auto;max-width:400px}.bar>div{height:100%;width:0;background:#35aa74;transition:width .4s}small{color:#678}</style></head>
<body><div class="panel"><h1>🔋 StickS3 배터리</h1>
<div id="battery">--%</div><div class="bar"><div id="fill"></div></div>
<p id="status">MQTT 연결 중…</p><p id="updated">마지막 수신: 없음</p>
<button id="refresh">재연결</button>
<p><small>PC 프로그램 설치 필요 없음 · StickS3 Wi-Fi 전송 후 자동 표시<br>무료 공개 MQTT 중계 서버 사용 (테스트용)</small></p>
<p><a href="./">← 스타게임 돌아가기</a></p></div>
<script src="https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"></script>
<script>
const TOPIC='drscience/sticks3/battery/7c5e20f0d4a849ab';
const BROKER='wss://broker.emqx.io:8084/mqtt';
const value=document.getElementById('battery'),fill=document.getElementById('fill'),statusEl=document.getElementById('status'),updated=document.getElementById('updated');
let client;
function connect(){
 if(client){client.end(true);client=null}
 if(typeof mqtt==='undefined'){statusEl.textContent='MQTT 라이브러리를 불러오지 못했습니다';return}
 statusEl.textContent='MQTT 연결 중…';
 client=mqtt.connect(BROKER,{clientId:'stargame_view_'+Math.random().toString(16).slice(2),connectTimeout:10000,reconnectPeriod:4000,clean:true});
 client.on('connect',()=>{statusEl.textContent='연결됨 · StickS3 신호 대기 중';client.subscribe(TOPIC,{qos:0},err=>{if(err)statusEl.textContent='구독 실패'})});
 client.on('message',(topic,msg)=>{
  if(topic!==TOPIC)return;
  try {
   const data=JSON.parse(msg.toString()),n=Number(data.battery);
   if(!Number.isFinite(n)||n<0||n>100)return;
   value.textContent=Math.round(n)+'%';
   fill.style.width=n+'%';fill.style.background=n<20?'#df604e':'#35aa74';
   updated.textContent='마지막 표시 신호: '+(data.sent_at||new Date().toLocaleString('ko-KR'));
   statusEl.textContent='배터리 수신 완료';
  }catch(e){statusEl.textContent='신호 형식 오류'}
 });
 client.on('reconnect',()=>statusEl.textContent='MQTT 재연결 중…');
 client.on('offline',()=>statusEl.textContent='MQTT 연결 끊김');
 client.on('error',()=>statusEl.textContent='MQTT 서버 연결 오류');
}
document.getElementById('refresh').onclick=connect;connect();
</script></body></html>
