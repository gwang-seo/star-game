<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스타게임 공개 사진 3장</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#eaf5ff;color:#16335b;margin:0;padding:24px}main{max-width:820px;margin:auto}figure{background:#fff;padding:14px;margin:16px 0;border-radius:15px;box-shadow:0 4px 15px #2342}img{width:100%;border-radius:10px}a{color:#155aa7}</style></head><body><main><h1>📷 스타게임 최근 공개 사진</h1><p>이 페이지에 게시된 사진은 누구나 볼 수 있습니다. 사진은 업로드 이후 갱신됩니다.</p><div id="gallery">사진 목록을 확인하는 중입니다.</div><p><a href="./camera.html">카메라로 돌아가기</a></p></main><script>
(async()=>{
 const root=document.getElementById('gallery');
 try{
  const res=await fetch('./public-camera/latest.json?ts='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw Error('아직 공개 사진이 없습니다.');
  const meta=await res.json();const count=Math.max(0,Math.min(3,Number(meta.count)||0));
  if(!count)throw Error('아직 공개 사진이 없습니다.');
  root.replaceChildren();
  for(let i=1;i<=count;i++){
   const fig=document.createElement('figure'),img=document.createElement('img'),a=document.createElement('a');
   const src='./public-camera/latest-'+i+'.jpg?ts='+encodeURIComponent(meta.updated_at||'');
   img.src=src;img.alt='최근 카메라 사진 '+i;img.loading='lazy';a.href=src;a.textContent='사진 '+i+' 원본 열기';a.target='_blank';a.rel='noopener noreferrer';fig.append(img,a);root.append(fig);
  }
 }catch(e){root.textContent=e.message}
})();
</script></body></html>
